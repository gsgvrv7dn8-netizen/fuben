[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathorcup-a-exploration"
version = "0.1.0"
description = "Reproducible exploratory baselines on observed standardized sensory targets"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
